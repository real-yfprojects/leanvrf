# Checks that run on `git commit` (after `pre-commit install`) and, identically,
# in CI (.github/workflows/test-scripts.yml, job `lint`). Every hook repository
# is pinned to a full commit id with the release tag kept in a `frozen:`
# comment; `check-frozen` below enforces that and that the two agree. Update
# with `pre-commit autoupdate --freeze`.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]

repos:
  # --- hygiene ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Diff context lines in patches carry significant trailing whitespace.
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      # toolchain.lock is written by jq (scripts/build-tools.sh) and copied here
      # verbatim after each tool release; these arguments reproduce jq's layout
      # exactly, so the committed file stays byte-identical to the release asset.
      - id: pretty-format-json
        files: ^toolchain\.lock$
        types: [file] # identify does not tag a .lock file as json
        args: [--indent=2, --no-sort-keys, --no-ensure-ascii, --autofix]

  # --- shell -----------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--indent=4, --case-indent, --binary-next-line, --write]

  # --- YAML / JSON formatting ------------------------------------------------
  # prettier itself is version-pinned here rather than pulled from a mirror
  # repository. Markdown is deliberately left alone (it would rewrite the
  # README's tables and emphasis); toolchain.lock is handled above.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.6.2"]
        entry: prettier --write --ignore-unknown
        types_or: [yaml, json]
        exclude: ^toolchain\.lock$

  # --- GitHub Actions workflows ----------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  # Security audit of the workflows: template injection, credential
  # persistence, permissions, and -- configured in .github/zizmor.yml -- that
  # every `uses:` is pinned to a commit id.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # frozen: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-metaschema
        files: ^schemas/.*\.json$

  # --- secrets ---------------------------------------------------------------
  # The upstream hook scans only the staged diff, which is empty under
  # `pre-commit run --all-files` in CI; scan the tree instead so both agree.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: golang
        additional_dependencies: ["github.com/zricethezav/gitleaks/v8@v8.30.1"]
        entry: gitleaks dir --redact --no-banner --exit-code=1 .
        pass_filenames: false

  # --- repository-specific pins ----------------------------------------------
  - repo: local
    hooks:
      - id: toolchain-lock
        name: toolchain.lock is well-formed
        language: python
        entry: python scripts/check-toolchain-lock.py
        files: ^(toolchain\.lock|patches/.*)$
        pass_filenames: false
      # A requirement line that does not continue onto `--hash=` lines would
      # break `pip install --require-hashes` in the attest job.
      - id: requirements-hashes
        name: requirements.txt is hash-pinned
        language: pygrep
        entry: '^[A-Za-z0-9][A-Za-z0-9_.-]*==\S+\s*$'
        files: ^scripts/requirements\.txt$

  # --- this file -------------------------------------------------------------
  - repo: https://github.com/real-yfprojects/check-pre-commit-config
    rev: ec697f7fda57bd81b86556212539e22f03aa86d9 # frozen: v1.0.0-alpha4
    hooks:
      - id: check-frozen
        # Check only: the default --fix-all rewrites the file even when it is
        # already correct (and with CRLF on Windows). Fix by hand or with
        # `pre-commit autoupdate --freeze`.
        args: [--strict]
