      "$comment": "Tag v1.1.6. Clean-room Lean 4 kernel in Haskell with a different checking strategy (normalises the export to a small core, re-derives recursors, re-typechecks every iota rule); the engine whose bugs are least likely to coincide with the C++ kernel's and nanoda's. 0 wrong verdicts on the arena, but young (created 2026-08-28), so a false rejection until the next bump is possible; that costs an honest prover a re-run, never soundness. The `script` is upstream's tools/arena-build.sh build line (a bare `ghc --make` with the ghc-options of eink0rn.cabal, which must stay in sync when bumping) spelled out here so it always uses the GHC pinned in `build_toolchains` and can never fall back to downloading a compiler as the upstream script would. It deliberately diverges from upstream in two places: `-rtsopts=ignoreAll` instead of `-rtsopts`, so the baked-in `-with-rtsopts` limits cannot be overridden by `+RTS` arguments or a GHCRTS variable at run time (upstream's flag honours both), and full-RELRO / non-executable-stack linker flags. PIE is not requested: GHC bindist libraries are not PIC, so eink0rn stays a non-PIE executable (build-tools.sh only warns about that). Runs with --enforce-mutual-univ so it checks the same language as Lean does. Takes the export path as its last argument; no axiom list, the whitelist is enforced by comparator and nanoda.",
