name: Verify Adversarial Lean Proof

on:
  workflow_call:
    inputs:
      theorem:
        description: "The Lean theorem identifier to verify"
        required: true
        type: string
      challenge_url:
        description: "HTTPS URL to untrusted Challenge.lean"
        required: true
        type: string
      solution_url:
        description: "HTTPS URL to untrusted Solution.lean"
        required: true
        type: string

permissions: {}

env:
  # Axiom whitelist. comparator rejects the solution if the theorem depends on
  # any other axiom (or sorry) and passes the same list to nanoda, which treats
  # an unlisted axiom anywhere in the export as a hard error. eink0rn takes no
  # axiom list; it only judges well-typedness. Defined once so the value the
  # checks ran with is the value recorded in the predicate.
  ALLOWED_AXIOMS: propext,Quot.sound,Classical.choice
  # in-toto predicate type of the attestation; schema in schemas/leanvrf-v1.json
  PREDICATE_TYPE: https://github.com/theproofnetwork/leanvrf/predicate/v1

jobs:
  # =========================================================================
  # JOB 1: SANDBOXED COMPARATOR RUN (build, export, compare, three kernels)
  # =========================================================================
  evaluate:
    runs-on: ubuntu-latest
    # NOTE: Self-hosted runners cannot be rejected here; the `runner` context is
    # not available in job-level `if`, and a step-level check would run on the
    # attacker's machine. Verifiers must reject attestations whose certificate
    # says runner_environment != github-hosted.
    permissions:
      contents: read
    env:
      # Lake project assembled from the untrusted inputs; the comparator jail
      # mounts it at /work. Nothing on the host ever reads it except by hash.
      PROJECT: /tmp/project
      CHALLENGE_MODULE: Challenge
      SOLUTION_MODULE: Solution
    outputs:
      challenge_sha: ${{ steps.digest.outputs.challenge_sha }}
      solution_sha: ${{ steps.digest.outputs.solution_sha }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # Check out *this* reusable workflow's repository at the exact commit that
      # is executing. `job.workflow_repository` / `job.workflow_sha` refer to the
      # called workflow, not the caller, and the same commit is bound into the
      # attestation certificate as job_workflow_sha. Helper scripts under
      # leanvrf/scripts are therefore fixed by the attested identity.
      - name: Check out trusted helper scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvrf
          persist-credentials: false

      # git is needed inside the comparator jail (comparator resolves it at
      # start-up); the runner image ships it, but do not depend on that.
      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                       bubblewrap jq curl coreutils zstd git

      # Fetches the Lean release from leanprover/lean4 and the prebuilt verifier
      # binaries from this repo's releases, each checked against the sha256 in
      # toolchain.lock. The lockfile is part of the trusted checkout, so the
      # attested job.workflow_sha pins the exact toolchain. Never cache this:
      # actions/cache is scoped to the caller (prover) repository.
      - name: Provision Pinned Toolchain
        run: bash leanvrf/scripts/provision-toolchain.sh leanvrf/toolchain.lock

      # TODO: Handle multi file challenges and solutions
      # TODO: allow reaching solution via actions/checkout
      # The URLs are prover-controlled locators and nothing about them is
      # trusted; the attestation binds the sha256 of whatever bytes arrived,
      # computed here by trusted code. fetch-untrusted.sh only makes sure curl
      # cannot do anything other than write the response body to the given path.
      - name: Fetch Untrusted Inputs & Calculate Hashes
        id: digest
        env:
          CHALLENGE_URL: ${{ inputs.challenge_url }}
          SOLUTION_URL: ${{ inputs.solution_url }}
        run: |
          set -euo pipefail
          bash leanvrf/scripts/fetch-untrusted.sh "$CHALLENGE_URL" "$PROJECT/$CHALLENGE_MODULE.lean"
          bash leanvrf/scripts/fetch-untrusted.sh "$SOLUTION_URL"  "$PROJECT/$SOLUTION_MODULE.lean"

          echo "challenge_sha=$(sha256sum "$PROJECT/$CHALLENGE_MODULE.lean" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "solution_sha=$(sha256sum "$PROJECT/$SOLUTION_MODULE.lean" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # comparator works on a Lake project (lakefile.toml with one lean_lib per
      # module) rather than on loose files or pre-made exports. Assembling it
      # is trusted code; nothing from the inputs but the two .lean files is
      # used. The host never has Lean in PATH: building and verifying happen
      # inside a bubblewrap jail only, and this assert enforces that.
      - name: Set Up Lake Project
        run: |
          set -euo pipefail
          if command -v lean || command -v lake; then
            echo "Security violation: Lean toolchain reachable on the host." >&2
            exit 1
          fi
          bash leanvrf/scripts/init-project.sh "$PROJECT" leanvrf/toolchain.lock \
            "$CHALLENGE_MODULE" "$SOLUTION_MODULE"

      # -----------------------------------------------------------------------
      # SANDBOXED COMPARATOR RUN
      # -----------------------------------------------------------------------
      # Inside the jail, comparator builds and exports the challenge (under
      # landrun) before any solution code runs, then builds and exports the
      # solution the same way; elaborating the solution is the only point where
      # untrusted code executes. It checks that the solution states the theorem
      # exactly as the challenge does and uses only whitelisted axioms, then
      # hands the one solution export to every kernel in `external_kernels`
      # (each under landrun) and replays it through the Lean kernel in-process.
      # All kernels judge the same bytes, so nothing outside the jail needs to
      # read .lake, and comparator's exit status is the joint verdict. Kernel
      # names containing "noda" receive nanoda's JSON config instead of the
      # export path; everything else gets the path as its last argument.
      - name: Comparator, Lean Kernel, nanoda & eink0rn (sandboxed)
        env:
          THEOREM: ${{ inputs.theorem }}
        run: |
          set -euo pipefail
          jq -n \
            --arg challenge "$CHALLENGE_MODULE" \
            --arg solution "$SOLUTION_MODULE" \
            --arg theorem "$THEOREM" \
            --arg axioms "$ALLOWED_AXIOMS" \
            '{
              challenge_module: $challenge,
              solution_module: $solution,
              theorem_names: [$theorem],
              permitted_axioms: ($axioms | split(",") | map(select(length > 0))),
              external_kernels: {
                nanoda: ["nanoda_bin"],
                eink0rn: ["eink0rn", "--enforce-mutual-univ", "-j"]
              }
            }' > /tmp/comparator.json
          cat /tmp/comparator.json
          bash leanvrf/scripts/sandboxed-comparator.sh "$PROJECT" /tmp/comparator.json

      # Reached only if every step above exited 0.
      - name: Record Verdict
        id: verdict
        run: echo "verdict=SUCCESS" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 2: ATTESTATION (Privileged; isolated from all execution environments)
  # =========================================================================
  attest:
    needs: evaluate
    if: needs.evaluate.outputs.verdict == 'SUCCESS'
    runs-on: ubuntu-latest
    # NOTE: see runner-environment note on the `evaluate` job.
    permissions:
      id-token: write
      contents: read
      attestations: write
      # this writes the attestation statement to some overview page on gh
      artifact-metadata: write # optional
    steps:
      - name: Check out trusted helper scripts & schema
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvrf
          persist-credentials: false

      # jq assembles the predicate, check-jsonschema validates it. Declared here
      # rather than relying on the runner image happening to ship jq.
      # check-jsonschema is hash-pinned via scripts/requirements.txt: nothing is
      # resolved at run time and pip refuses any package whose bytes differ.
      - name: Install Validation Tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
          python3 -m venv /tmp/attest-venv
          /tmp/attest-venv/bin/pip install --require-hashes --no-deps --only-binary=:all: \
            -r leanvrf/scripts/requirements.txt
          echo "/tmp/attest-venv/bin" >> "$GITHUB_PATH"

      # The predicate carries only the verification claim and the toolchain
      # facts. Workflow identity, runner environment, repository and run id are
      # NOT passed in: the certificate minted below states them from GitHub's
      # OIDC token, and verifiers must read them from there (README
      # "Attestation contents").
      - name: Build Verification Predicate
        env:
          THEOREM: ${{ inputs.theorem }}
          CHALLENGE_URL: ${{ inputs.challenge_url }}
          CHALLENGE_SHA: ${{ needs.evaluate.outputs.challenge_sha }}
          SOLUTION_URL: ${{ inputs.solution_url }}
          SOLUTION_SHA: ${{ needs.evaluate.outputs.solution_sha }}
          # Same trusted checkout as the evaluate job; expanded into the toolchain block
          TOOLCHAIN_LOCK: leanvrf/toolchain.lock
          SCHEMA_FILE: leanvrf/schemas/leanvrf-v1.json
        run: bash leanvrf/scripts/build-predicate.sh /tmp/attest/predicate.json

      - name: Prepare Subjects
        env:
          CHALLENGE_SHA: ${{ needs.evaluate.outputs.challenge_sha }}
          SOLUTION_SHA: ${{ needs.evaluate.outputs.solution_sha }}
        run: |
          cat <<EOF > /tmp/attest/subjects.checksums
          $CHALLENGE_SHA  Challenge.lean
          $SOLUTION_SHA   Solution.lean
          EOF

      - name: Sign & Mint Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: /tmp/attest/subjects.checksums
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: /tmp/attest/predicate.json
