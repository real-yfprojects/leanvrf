name: Verify Adversarial Lean Proof

on:
  workflow_call:
    inputs:
      theorem:
        description: "The Lean theorem identifier to verify"
        required: true
        type: string
      challenge_url:
        description: "HTTPS URL to untrusted Challenge.lean"
        required: true
        type: string
      solution_url:
        description: "HTTPS URL to untrusted Solution.lean"
        required: true
        type: string

permissions: {}

env:
  # TODO: Create the container on ghcr.io
  #       build with safe memory flags
  # TODO: harden by pinning the image by digest (...@sha256:...) instead of a tag
  TOOLCHAIN_IMAGE: ghcr.io/real-yfprojects/leanvrf-tools:v1
  # TODO dynamic toolchain digest: better attestation chaining with inputAttestations
  TOOLCHAIN_DIGEST: sha256:d8a29b4e724efb1e843c0d603a118e95c11030e8c7512d7b1b3699bce866a2cb

jobs:
  # =========================================================================
  # JOB 1: DUAL ISOLATED UNTRUSTED EXPORT & TRUSTED COMPARATOR CALL
  # =========================================================================
  evaluate:
    runs-on: ubuntu-latest
    # NOTE: Self-hosted runners cannot be rejected here; the `runner` context is
    # not available in job-level `if`, and a step-level check would run on the
    # attacker's machine. Verifiers must reject attestations whose certificate
    # says runner_environment != github-hosted.
    permissions:
      contents: read
    outputs:
      challenge_sha: ${{ steps.digest.outputs.challenge_sha }}
      solution_sha: ${{ steps.digest.outputs.solution_sha }}
      verdict: ${{ steps.compare.outputs.verdict }}
    steps:
      # Check out *this* reusable workflow's repository at the exact commit that
      # is executing. `job.workflow_repository` / `job.workflow_sha` refer to the
      # called workflow, not the caller, and the same commit is bound into the
      # attestation certificate as job_workflow_sha. Helper scripts under
      # leanvrf/scripts are therefore fixed by the attested identity.
      - name: Check out trusted helper scripts
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvrf
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends             bubblewrap jq curl coreutils

      # TODO: harden by verifying the container
      - name: Provision Verifier Binaries from Toolchain Image
        run: |
          sudo mkdir -p /opt/lean /opt/bin
          CONTAINER_ID=$(docker create "$TOOLCHAIN_IMAGE")

          # Extract Lean toolchain (for the bwrap sandbox)
          sudo docker cp "$CONTAINER_ID:/opt/lean/." /opt/lean/
          # Extract standalone verification binaries (for host Stage 3)
          sudo docker cp "$CONTAINER_ID:/opt/bin/."  /opt/bin/
          sudo docker rm "$CONTAINER_ID"

          sudo chmod +x /opt/bin/* /opt/lean/bin/*

      # TODO: Handle multi file challenges and solutions
      # TODO: allow reaching solution via actions/checkout
      - name: Fetch Untrusted Inputs & Calculate Hashes
        id: digest
        env:
          CHALLENGE_URL: ${{ inputs.challenge_url }}
          SOLUTION_URL: ${{ inputs.solution_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw_inputs

          fetch_untrusted_file() {
            local url="$1"
            local dest_path="$2"

            if [ -z "$url" ] || [ -z "$dest_path" ]; then
                echo "Usage: fetch_untrusted_file <url> <destination_path> [max_time_sec] [max_bytes]" >&2
                return 1
            fi

            # Ensure target directory exists and clear pre-existing target (mitigates symlink hijacking)
            mkdir -p "$(dirname "$dest_path")"
            rm -f "$dest_path"

            # Execute hardened fetch:
            # - Restrict initial protocol and redirects strictly to HTTPS
            # - Enforce TLS 1.2+ minimum
            # - Terminate on HTTP errors (--fail)
            # - Bound download time and payload size to neutralize DoS/memory tarpits
            # - Use '--' separator to prevent URL-based argument injection into curl
            if ! curl \
                --proto '=https' \
                --proto-redir '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                --location \
                -o "$dest_path" \
                -- "$url"; then
                echo "Error: Failed to safely fetch '$url'" >&2
                rm -f "$dest_path"
                return 1
            fi

            # Defensive assertion: Verify destination is a regular file and not a symlink/FIFO
            if [ ! -f "$dest_path" ] || [ -L "$dest_path" ]; then
                echo "Security violation: Downloaded destination is invalid or not a regular file." >&2
                rm -f "$dest_path"
                return 1
            fi
            }

          # Define paths
          CHALLENGE_FILE="/tmp/raw_inputs/Challenge.lean"
          SOLUTION_FILE="/tmp/raw_inputs/Solution.lean"

          # Fetch both untrusted files safely
          fetch_untrusted_file "$CHALLENGE_URL" "$CHALLENGE_FILE"
          fetch_untrusted_file "$SOLUTION_URL"  "$SOLUTION_FILE"

          echo "challenge_sha=$(sha256sum "$CHALLENGE_FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "solution_sha=$(sha256sum "$SOLUTION_FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # SANDBOXED Export Challenge AST
      # -----------------------------------------------------------------------
      - name: Compile & Export ASTs
        run: |
          set -euo pipefail
          mkdir -p /tmp/exports

          # Wrapper comes from the trusted checkout, never from caller-controlled input
          bash leanvrf/scripts/sandboxed-lean4export.sh /tmp/raw_inputs/Challenge.lean /tmp/exports/challenge.export
          bash leanvrf/scripts/sandboxed-lean4export.sh /tmp/raw_inputs/Solution.lean  /tmp/exports/solution.export

      # -----------------------------------------------------------------------
      # Trusted Comparator & Independent Kernel Check
      # (Consumes only inert .export files; no code execution possible)
      # -----------------------------------------------------------------------
      - name: Run Trusted Multi-Kernel Verification & Comparator
        id: compare
        env:
          THEOREM: ${{ inputs.theorem }}
        run: |
          set -euo pipefail

          # Assert Lean compiler is absent from host PATH
          if command -v lean || command -v lake; then
            echo "Security violation: Lean compiler detected on host."
            exit 1
          fi

          AXIOMS="propext,Quot.sound,Classical.choice"
          SANDBOX=leanvrf/scripts/sandboxed-verifier.sh

          echo "=== 1/3: Structural AST Equivalence (comparator) ==="
          bash "$SANDBOX" /opt/bin/comparator \
          --mode export \
          --challenge-export /exports/challenge.export \
          --solution-export /exports/solution.export \
          --theorem "$THEOREM" \
          --allowed-axioms "$AXIOMS"

          echo "=== 2/3: Independent Rust Kernel (nanoda) ==="
          bash "$SANDBOX" /opt/bin/nanoda_bin \
          --allowed-axioms "$AXIOMS" \
          /exports/solution.export

          echo "=== 3/3: Formally Verified Kernel (lean4lean) ==="
          bash "$SANDBOX" /opt/bin/lean4lean \
          --export \
          --allowed-axioms="$AXIOMS" \
          /exports/solution.export

          # Only the parent runner process reaches this line if all 3 jails exit 0
          echo "verdict=SUCCESS" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 2: ATTESTATION (Privileged; isolated from all execution environments)
  # =========================================================================
  attest:
    needs: evaluate
    if: needs.evaluate.outputs.verdict == 'SUCCESS'
    runs-on: ubuntu-latest
    # NOTE: see runner-environment note on the `evaluate` job.
    permissions:
      id-token: write
      contents: read
      attestations: write
      # this writes the attestation statement to some overview page on gh
      artifact-metadata: write # optional
    steps:
      - name: Check out trusted helper scripts & schema
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: leanvrf
          persist-credentials: false

      # TODO harden by sourcing the package from the toolchain container
      - name: Install Validation Tools
        run: pipx install check-jsonschema

      - name: Build Lean-Extended VSA Predicate
        env:
          THEOREM: ${{ inputs.theorem }}
          CHALLENGE_SHA: ${{ needs.evaluate.outputs.challenge_sha }}
          SOLUTION_SHA: ${{ needs.evaluate.outputs.solution_sha }}
          SOLUTION_URL: ${{ inputs.solution_url }}
          # Identity of this reusable workflow; matches job_workflow_ref in the certificate
          VERIFIER_ID: https://github.com/${{ job.workflow_ref }}
          SCHEMA_FILE: leanvrf/schemas/leanvrf-v1.json
        run: bash leanvrf/scripts/build-predicate.sh /tmp/attest/predicate.json

      - name: Prepare Subjects
        env:
          CHALLENGE_SHA: ${{ needs.evaluate.outputs.challenge_sha }}
          SOLUTION_SHA: ${{ needs.evaluate.outputs.solution_sha }}
        run: |
          cat <<EOF > /tmp/attest/subjects.checksums
          $CHALLENGE_SHA  Challenge.lean
          $SOLUTION_SHA   Solution.lean
          EOF

      - name: Sign & Mint Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: /tmp/attest/subjects.checksums
          predicate-type: "urn:leanvrf:v1"
          predicate-path: /tmp/attest/predicate.json
