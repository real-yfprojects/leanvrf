name: Test Helper Scripts

# Exercises the trusted host-side scripts against the inputs a hostile prover
# controls: URL shapes, adversarial repository trees, Lake manifests, and the
# tree digest. See scripts/test-fetch.sh for the cases. Runs on every push and
# pull request; nothing here touches the toolchain or produces attestations.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                       bubblewrap jq curl git openssl python3 ca-certificates shellcheck
          # Same as leanvfy.yml: bwrap's --disable-userns needs unrestricted
          # unprivileged user namespaces on Ubuntu 24.04.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Syntax & ShellCheck
        run: |
          set -euo pipefail
          for f in scripts/*.sh verify.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/*.sh

      - name: Untrusted-input hardening tests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/test-fetch.sh

      # The comparator patch must keep applying to the pinned upstream commit.
      - name: Comparator patch applies to the pinned commit
        run: |
          set -euo pipefail
          commit="$(jq -er '.tools[] | select(.name == "comparator") | .commit' toolchain.lock)"
          git clone -q --no-checkout https://github.com/leanprover/comparator.git /tmp/comparator
          git -C /tmp/comparator checkout -q "$commit"
          for p in $(jq -r '.tools[] | select(.name == "comparator") | .patches[]' toolchain.lock); do
            git -C /tmp/comparator apply --check "$GITHUB_WORKSPACE/$p"
            echo "$p applies"
          done

      # A predicate built from placeholder values must validate against the schema.
      - name: Predicate schema round trip
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements.txt
          export PATH="/tmp/venv/bin:$PATH"
          THEOREM="Foo.main" \
          CHALLENGE_REPO="https://github.com/a/b" CHALLENGE_COMMIT="$(printf 'a%.0s' $(seq 40))" \
          CHALLENGE_MODULE="Challenge.Statement" CHALLENGE_DIGEST="$(printf '1%.0s' $(seq 64))" \
          SOLUTION_REPO="https://github.com/c/d" SOLUTION_COMMIT="$(printf 'b%.0s' $(seq 40))" \
          SOLUTION_MODULE="Solution" SOLUTION_DIGEST="$(printf '2%.0s' $(seq 64))" \
          ALLOWED_AXIOMS="propext,Quot.sound,Classical.choice" \
          TOOLCHAIN_LOCK=toolchain.lock SCHEMA_FILE=schemas/leanvfy-v1.json \
          bash scripts/build-predicate.sh /tmp/predicate.json
          jq . /tmp/predicate.json
